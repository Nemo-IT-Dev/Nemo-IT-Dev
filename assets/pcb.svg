<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Método Morales: 01 Diagnóstico, 02 Diseño, 03 Desarrollo, 04 Medición">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2b343d" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade2" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask2"><rect width="1200" height="280" fill="url(#fade2)"/></mask>
  </defs>

  <rect width="1200" height="280" fill="#080d11"/>
  <rect width="1200" height="280" fill="url(#grid2)" mask="url(#gridMask2)" opacity="0.4"/>

  <g stroke="#2b343d" fill="none" stroke-width="2">
    <path d="M28 40V16h24"/>
    <path d="M1148 16h24v24"/>
    <path d="M1172 240v24h-24"/>
    <path d="M52 264H28v-24"/>
  </g>

  <text x="60" y="54" font-family="JetBrains Mono,Consolas,monospace" font-size="13" letter-spacing="4" fill="#5bf0b8">// DEL PROBLEMA AL MÉTODO</text>

  <path d="M80 160H1120" stroke="#2b343d" stroke-width="2" fill="none"/>

  <g>
    <circle cx="330" cy="160" r="5" fill="#080d11" stroke="#5bf0b8" stroke-width="1.5"/><circle cx="330" cy="160" r="1.8" fill="#5bf0b8"/>
    <circle cx="600" cy="160" r="5" fill="#080d11" stroke="#5bf0b8" stroke-width="1.5"/><circle cx="600" cy="160" r="1.8" fill="#5bf0b8"/>
    <circle cx="870" cy="160" r="5" fill="#080d11" stroke="#5bf0b8" stroke-width="1.5"/><circle cx="870" cy="160" r="1.8" fill="#5bf0b8"/>
  </g>

  <g font-family="JetBrains Mono,Consolas,monospace">
    <rect x="80" y="84" width="230" height="150" rx="6" fill="#11171c" stroke="#2b343d"/>
    <rect x="172" y="70" width="46" height="14" rx="2" fill="#11171c" stroke="#2b343d"/><rect x="182" y="74" width="26" height="6" fill="#5bf0b8"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/></rect>
    <line x1="182" y1="70" x2="182" y2="64" stroke="#2b343d"/><line x1="208" y1="70" x2="208" y2="64" stroke="#2b343d"/>
    <text x="96" y="122" font-size="15" fill="#5bf0b8">// 01</text>
    <text x="96" y="152" font-size="22" font-weight="700" fill="#eef2f7">Diagnóstico</text>
    <text x="96" y="180" font-size="13" fill="#8f9aa4">qué te frena y qué</text>
    <text x="96" y="200" font-size="13" fill="#8f9aa4">se puede reutilizar</text>

    <rect x="350" y="84" width="230" height="150" rx="6" fill="#11171c" stroke="#2b343d"/>
    <rect x="442" y="70" width="46" height="14" rx="2" fill="#11171c" stroke="#2b343d"/><rect x="452" y="74" width="26" height="6" fill="#5bf0b8"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="0.7s" repeatCount="indefinite"/></rect>
    <line x1="452" y1="70" x2="452" y2="64" stroke="#2b343d"/><line x1="478" y1="70" x2="478" y2="64" stroke="#2b343d"/>
    <text x="366" y="122" font-size="15" fill="#5bf0b8">// 02</text>
    <text x="366" y="152" font-size="22" font-weight="700" fill="#eef2f7">Diseño</text>
    <text x="366" y="180" font-size="13" fill="#8f9aa4">la arquitectura: las</text>
    <text x="366" y="200" font-size="13" fill="#8f9aa4">trazas por donde va todo</text>

    <rect x="620" y="84" width="230" height="150" rx="6" fill="#11171c" stroke="#2b343d"/>
    <rect x="712" y="70" width="46" height="14" rx="2" fill="#11171c" stroke="#2b343d"/><rect x="722" y="74" width="26" height="6" fill="#5bf0b8"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1.4s" repeatCount="indefinite"/></rect>
    <line x1="722" y1="70" x2="722" y2="64" stroke="#2b343d"/><line x1="748" y1="70" x2="748" y2="64" stroke="#2b343d"/>
    <text x="636" y="122" font-size="15" fill="#5bf0b8">// 03</text>
    <text x="636" y="152" font-size="22" font-weight="700" fill="#eef2f7">Desarrollo</text>
    <text x="636" y="180" font-size="13" fill="#8f9aa4">componentes que venden,</text>
    <text x="636" y="200" font-size="13" fill="#8f9aa4">sin plantillas</text>

    <rect x="890" y="84" width="230" height="150" rx="6" fill="#11171c" stroke="#2b343d"/>
    <rect x="982" y="70" width="46" height="14" rx="2" fill="#11171c" stroke="#2b343d"/><rect x="992" y="74" width="26" height="6" fill="#5bf0b8"><animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="2.1s" repeatCount="indefinite"/></rect>
    <line x1="992" y1="70" x2="992" y2="64" stroke="#2b343d"/><line x1="1018" y1="70" x2="1018" y2="64" stroke="#2b343d"/>
    <text x="906" y="122" font-size="15" fill="#5bf0b8">// 04</text>
    <text x="906" y="152" font-size="22" font-weight="700" fill="#eef2f7">Medición</text>
    <text x="906" y="180" font-size="13" fill="#8f9aa4">lo que no se mide,</text>
    <text x="906" y="200" font-size="13" fill="#8f9aa4">no mejora</text>
  </g>
</svg>